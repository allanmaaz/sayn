name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.4
          name: "SAYN Android Release v1.0.4 (Built-in In-App Auto-Updater)"
          body: |
            ### SAYN v1.0.4 — Say it. Refine it. Send it.
            Official release for Android.
            
            **What's New in v1.0.4:**
            * **Built-in In-App Auto-Updater:**
              - Never manually download from GitHub or browse your Downloads folder again!
              - SAYN automatically checks for updates on startup against GitHub Releases.
              - When a new update is released, a modal appears with release notes and a single **"⚡ Download & Install Update"** button.
              - Downloads with real-time progress indicator and immediately prompts the Android system installer to update in-place with 1 tap.
              - Manual "Check for Updates Now" button also available in Settings.
            * **Wispr Flow 3-Piece Floating Speech Pill:**
              - `[ ✕ ]` frosted circular cancel button.
              - Translucent speech capsule with live streaming words + animated purple dots `• • • • •`.
              - `[ ✓ ]` Wispr purple button: commits text instantly into WhatsApp/chat box and dismisses.
            * **Translucent Squircle Floating Assistant:**
              - Frosted glass squircle (`cornerRadius = 16dp`, `#A61E1E22`).
              - Drag-to-dismiss gesture: dragging towards bottom center cross turns red and dismisses with haptics.
              - Auto-visibility: ONLY appears when a chatbot/input is open with keyboard, disappears when keyboard closes.
            
            **What's New in v1.0.1:**
            * **Authentic iOS 17 Dark Mode Keyboard:** Redesigned keycaps with raised chiclet styling, drop shadows, staggered row spacing, and crisp 22sp white typography (no dot/ellipsis clipping).
            * **Wispr Flow Real-Time Voice Dictation:** Tap mic to stream real-time partial speech results directly in the keyboard with immediate **"✓ Correct"** commit directly into the active text box.
            * **Microphone Permissions Flow:** Added automatic microphone permission handling in MainActivity and Keyboard settings.
            * **AI Style Modes:** Standard, Fluent, Natural, Professional, Casual, Shorten, Expand.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
