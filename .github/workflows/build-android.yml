name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.1
          name: "SAYN Android Release v1.1.1 (Hands-Free Voice-to-Textbox Auto Insertion)"
          body: |
            ### SAYN v1.1.1 — Hands-Free Voice-to-Textbox Automatic Insertion
            Official release for Android.
            
            **What's New in v1.1.1:**
            * **Hands-Free Zero-Click Voice Insertion Across Android:**
              - **Floating Pill Overlay:** Finished speaking automatically refines and injects polished text directly into WhatsApp, Telegram, ChatGPT, Gmail, Slack, and Notes without requiring manual checkmark tap.
              - **Custom IME Keyboard:** In-keyboard speech recognition automatically refines and commits polished text straight into the active input connection.
              - **In-App Studio & Voice Flow Screen:** Live speech stream renders directly into the input text box and auto-polishes into the result box on speech completion.
            * **Official SAYN Logo & Brand Palette:**
              - Complete aesthetic alignment to Deep Maroon (`#6F1025`), Rose Maroon (`#A83249`), and Warm Cream (`#F5EBDD`).
            * **Embedded Unlimited Cloud Polishing & Auto-Updater:**
              - Instant background updates and multi-style voice transformation.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
