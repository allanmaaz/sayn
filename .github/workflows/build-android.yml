name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk
          retention-days: 1

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.3
          name: "SAYN Android Release v1.1.3 (Minimal Chiclet Keyboard & Bug Fixes)"
          body: |
            ### SAYN v1.1.3 — Minimal Chiclet Keyboard & System Enhancements
            Official signed release for Android.
            
            **What's New in v1.1.3:**
            * **Zero-View-Destruction In-Place Case Shifting:**
              - Completely resolved first-character clear glitch.
              - Sentence capitalization and Shift toggling update keycaps in-place with zero latency and zero view tree destruction.
              - Atomic batch editing (`beginBatchEdit`/`endBatchEdit`) on key commitments and suggestion replacements.
            * **Instant Universal Text Injection:**
              - Direct injection through active SAYN keyboard `InputConnection` with instant fallback to `SaynAccessibilityService` and clipboard.
            * **Android 13–15 Restricted Settings Bypass:**
              - In-app guided 4-step assistant with direct App Info deep link to allow restricted accessibility settings on sideloaded APKs.
            * **Signature Mammals Voice Tone:**
              - Clean casual texting with zero trailing periods promoted across all voice tools.
            * **Harmonized Minimal Architecture:**
              - Stripped mode drawer clutter from keyboard; voice dictation and refinement are consolidated into the floating overlay.
              - Bottom navigation labels refined to prevent text clipping on all devices.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
