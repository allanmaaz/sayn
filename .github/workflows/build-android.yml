name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "SAYN Android Release v1.1.0 (Deep Maroon & Warm Cream Official Theme, Integrated Logo)"
          body: |
            ### SAYN v1.1.0 — Official Deep Maroon & Warm Cream Theme with Integrated Logo
            Official release for Android.
            
            **What's New in v1.1.0:**
            * **Official SAYN Logo Integration:**
              - Master SAYN logo integrated into app launcher icons across all mipmap densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`) with adaptive safe-zone geometry.
              - In-app logo integration in Voice Engine and Studio headers.
            * **Signature Color Theme Alignment:**
              - Complete aesthetic alignment to SAYN's Deep Maroon (`#6F1025`), Rose Maroon (`#A83249`), Obsidian Void (`#100709`), and Warm Cream (`#F5EBDD`).
              - Floating overlay, floating bottom nav dock, IME keyboard, and in-app screens fully harmonized.
            * **Universal Floating Assistant & Accessibility Service:**
              - Floating voice pill with animated equalizer soundwave and instant transcription.
              - Direct typing injection into any Android text box (WhatsApp, Telegram, ChatGPT, Notes, etc.).
            * **Embedded Unlimited Cloud Polishing:**
              - Multi-style AI voice refinement (Standard, Fluent, Natural, Professional, Casual, Shorten, Expand, Formal).
            * **Built-in Auto-Updater:**
              - Real-time in-app check and seamless background APK installer.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
