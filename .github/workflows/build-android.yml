name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "SAYN Android Release v1.0.3 (Wispr 3-Piece Pill, Floating Squircle & Drag-to-Dismiss)"
          body: |
            ### SAYN v1.0.3 — Say it. Refine it. Send it.
            Official release for Android.
            
            **What's New in v1.0.3:**
            * **Wispr Flow 3-Piece Floating Speech Pill:**
              - Left: Circular frosted glass button with `✕` to cancel/dismiss dictation.
              - Center: Translucent frosted capsule displaying real-time streaming speech words + live purple `• • • • •` dots.
              - Right: Vibrant Wispr purple circular button with `✓`. Tapping `✓` immediately commits the speech into WhatsApp/ChatGPT/any typing box and dismisses the pill.
            * **Translucent Squircle Floating Assistant:**
              - Redesigned from a plain circle to a modern translucent squircle (16dp rounded corners, dark frosted glass `#A61E1E22`, subtle frosted border).
            * **Drag-to-Dismiss Gesture at Bottom Center:**
              - Dragging the floating assistant towards bottom center brings up a dismiss circle with cross `✕`.
              - Target scales up and turns active red when near; dropping it dismisses the floating assistant with haptic feedback.
            * **Auto-Show Only When Keyboard / Chatbot Is Open:**
              - The floating assistant no longer clutters your screen 24/7. It automatically appears when you open a chat and your keyboard comes up (`onStartInputView`), and vanishes completely the instant you close the keyboard or exit the chat (`onFinishInputView` / `onWindowHidden`).
              - Tapping the floating squircle while typing immediately launches the Wispr dictation bar.
            * **Resolved Microphone Error 5:** Full Android 11+ `<queries>` package visibility for Google Speech Services and clean lifecycle teardown.
            
            **What's New in v1.0.1:**
            * **Authentic iOS 17 Dark Mode Keyboard:** Redesigned keycaps with raised chiclet styling, drop shadows, staggered row spacing, and crisp 22sp white typography (no dot/ellipsis clipping).
            * **Wispr Flow Real-Time Voice Dictation:** Tap mic to stream real-time partial speech results directly in the keyboard with immediate **"✓ Correct"** commit directly into the active text box.
            * **Microphone Permissions Flow:** Added automatic microphone permission handling in MainActivity and Keyboard settings.
            * **AI Style Modes:** Standard, Fluent, Natural, Professional, Casual, Shorten, Expand.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
