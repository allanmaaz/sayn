name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release -v

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk
          retention-days: 1

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.4
          name: "SAYN Android Release v1.1.4 (Samsung One UI Keyboard & Wispr Flow Engine)"
          body: |
            ### SAYN v1.1.4 — Samsung One UI Keyboard & Wispr Flow Engine
            Official signed release for Android.
            
            **What's New in v1.1.4:**
            * **1:1 Samsung One UI Keyboard Layout & Mechanics:**
              - **Spacebar Sliding Cursor Trackpad**: Slide your finger left or right across the spacebar for smooth character-by-character cursor navigation with tactile feedback.
              - **Secondary Symbol & Numeric Sub-Labels**: Numbers 1-0 atop Q-P, punctuation (@, #, $, %, &, *, -, +, (, ), !, ?, :, ;, ', ", /) on lower rows; instant 240ms long-press emission.
              - **One UI Quick Action Toolbar**: Direct access to Stickers/Emoji, Clipboard paste tray, Voice Mic, SAYN AI, Settings, and Prediction row switcher.
              - **Samsung One UI Key Geometry**: 6.5dp corner radius keycaps with authentic obsidian plum and warm cream palette.
            * **Wispr Flow Real-Time Conciseness Engine:**
              - **Spoken Punctuation Parsing**: Automatically converts spoken commands ("question mark", "period", "comma", "new line", "new paragraph") into clean typographic punctuation.
              - **Disfluency & Hesitation Stripping**: Eliminates "um", "uh", "you know", "like", "basically", and "sort of" in real time.
              - **Currency & Number Formatting**: Formats "$20" from "twenty dollars" and percentages cleanly.
              - **Mammals Casual Texting Tone**: Strictly maintains zero trailing periods for effortless modern messaging.
            * **GEC Training Pipeline (Lakhs of Datasets):**
              - Comprehensive multi-source dataset aggregator (Lang-8, BEA-2019, JFLEG, synthetic mobile corruptor) for fine-tuning LLaMA 3.2 1B & Gemma 2 2B with QLoRA.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
