name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Ensure Android Platform & Dependencies
        run: |
          cd apps/android
          flutter create . --org com.sayn --platforms android
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release --verbose

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "SAYN Android Release v1.0.0"
          body: |
            ### SAYN — Say it. Refine it. Send it.
            Official release for Android.
            
            **Features:**
            * Native Android AI Writing Keyboard (QuillBot style)
            * System-wide Floating Voice Assistant (Wispr Flow style)
            * Multimodal Speech-to-Text & AI Refinements powered by Google Gemini
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android phone.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
