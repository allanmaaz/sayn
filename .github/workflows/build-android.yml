name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd apps/android
          OUT=$(flutter analyze 2>&1 || true)
          echo "$OUT"
          FIRST_ERRORS=$(echo "$OUT" | grep -E "(error •|warning •|info •)" | head -n 15 | tr '\n' ' | ' | tr '"' "'")
          echo "::error::ANALYZE: $FIRST_ERRORS"
          if echo "$OUT" | grep -q "error •"; then
            exit 1
          fi

      - name: Build Release APK
        run: |
          cd apps/android
          flutter build apk --release

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: apps/android/build.log
          retention-days: 1

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk
          retention-days: 1

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.5
          name: "SAYN Android Release v1.1.5 (Universal Floating Overlay & Dual AI Cards)"
          body: |
            ### SAYN v1.1.5 — Universal Floating Overlay & Dual AI Suggestion Cards
            Official signed release for Android.
            
            **What's New in v1.1.5:**
            * **Universal Floating Mic Overlay:**
              - Glowing circular burgundy orb (`#6F1025`) with concentric halo rings and official SAYN wave ribbon logo.
              - 6-dot vertical tactile gripper handle (`:::`) for smooth fluid dragging anywhere on screen.
              - Auto-wakes across any keyboard (Samsung, Gboard, SwiftKey) whenever an editable text field is tapped.
            * **Dual AI Suggestion Cards Above Keyboard:**
              - Left card: `✨ Grammar correction` with diff badges (`there → THERE`), `✓ Accept`, and `✕ Dismiss`.
              - Right card: `🔄 Rewrite suggestion` with `📋 Replace` and `⏱ Retry`.
            * **Top Quick-Action Toolbar:**
              - SAYN brand squircle logo button on left.
              - Style pills: `✨ Grammar`, `🔄 Rewrite`, `📄 Humanize`, `💼 Formal`.
              - Down chevron toggle to collapse and expand cards.
            * **In-App Auto-Update System:**
              - Seamless detection and 1-tap in-app download and installation.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
