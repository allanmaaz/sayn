name: Build SAYN Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x apps/android/android/gradlew

      - name: Get Flutter Dependencies
        run: |
          cd apps/android
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd apps/android
          OUT=$(flutter analyze 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -q "error •"; then
            FIRST_ERRORS=$(echo "$OUT" | grep "error •" | head -n 15 | tr '\n' ' | ' | tr '"' "'")
            echo "::error::ANALYZE: $FIRST_ERRORS"
            exit 1
          fi

      - name: Build Release APK
        run: |
          cd apps/android
          touch build.log
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build.log
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" -ne 0 ]; then
            FAIL_LINES=$(grep -E "(e: |error:|FAILED|Exception|FAILURE:)" build.log | tail -n 25 | tr '\n' ' | ' | tr '"' "'")
            echo "::error::BUILD: $FAIL_LINES"
            tail -n 120 build.log
            exit "$STATUS"
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: apps/android/build.log
          retention-days: 1

      - name: Copy APK to Root Release
        run: |
          mkdir -p release
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk release/sayn-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sayn-release-apk
          path: release/sayn-release.apk
          retention-days: 1

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.6
          name: "SAYN Android Release v1.1.6 (Samsung One UI 8.5 Keyboard Engine & Word Meaning Engine)"
          body: |
            ### SAYN v1.1.6 — Samsung One UI 8.5 Keyboard Engine & Interactive Dictionary
            Official release for Android with zero-lag tactile typing and contextual word lookup.
            
            **What's New in v1.1.6:**
            * **Samsung One UI 8.5 Zero-Lag Keyboard Engine:**
              - Zero-latency tactile sound & haptics triggered instantly on `ACTION_DOWN` (pre-allocated vibration effects).
              - Ultra-fluid spacebar trackpad cursor glide (`◄ Cursor control ►`).
              - Authentic One UI 8.5 bottom row layout: `[!#1] [😊] [,] [English (US)] [.] [↵]`.
              - Integrated `✦ AI` Writing Assist pill toolbar with Grammar, Rewrite, and Tone adjustments.
            * **Interactive Word Meaning & Dictionary:**
              - Tap-to-define on any word token in the workspace and editor.
              - Direct phonetic IPA transcription with native audio pronunciation (`🔊`).
              - Real-world example cards and contextual nuance explanations powered by Gemini 2.5 Flash.
              - `❄️ Freeze Word` toggle to lock brand names, acronyms, and proper nouns from AI alterations.
            * **Universal Floating Mic Overlay:**
              - Fast mic overlay with auto-activation across any Android keyboard.
            * **Refined Web Landing Page:**
              - High-contrast warm editorial aesthetic with seamless setup flow and interactive speed benchmarks.
            
            **Installation:**
            Download `sayn-release.apk` below and install directly on your Android device.
          files: release/sayn-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
