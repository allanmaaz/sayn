<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
    }
    .pill-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(13, 13, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(203, 254, 0, 0.12);
    }
    .btn-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: all 0.15s ease;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #94A3B8;
    }
    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #EF4444;
    }
    .btn-commit {
      background: #CBFE00;
      color: #0D0D12;
      box-shadow: 0 0 12px rgba(203, 254, 0, 0.35);
    }
    .btn-commit:hover {
      transform: scale(1.08);
      background: #D9FF33;
    }
    .wave-center {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 8px;
      min-width: 160px;
      max-width: 220px;
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 20px;
    }
    .wave-bar {
      width: 2.5px;
      border-radius: 2px;
      background: #CBFE00;
      animation: pulse 1s infinite ease-in-out;
    }
    .wave-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 10px; animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { height: 16px; animation-delay: 0.15s; }
    .wave-bar:nth-child(6) { height: 8px; animation-delay: 0.35s; }

    @keyframes pulse {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1.2); opacity: 1; }
    }

    .transcript-text {
      font-size: 11px;
      color: #E2E8F0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="pill-container">
    <button class="btn-circle btn-cancel" id="btn-cancel" title="Cancel (Esc)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    
    <div class="wave-center">
      <div class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="transcript-text" id="status-text">Listening...</div>
    </div>

    <button class="btn-circle btn-commit" id="btn-commit" title="Commit & Auto-Paste">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let currentTranscript = '';

    document.getElementById('btn-cancel').onclick = () => {
      ipcRenderer.send('pill-close');
    };

    document.getElementById('btn-commit').onclick = () => {
      const textToPaste = currentTranscript || 'Refined output with SAYN.';
      ipcRenderer.send('pill-paste', textToPaste);
    };

    // Listen for start listening events
    ipcRenderer.on('start-listening', () => {
      document.getElementById('status-text').innerText = 'Listening...';
      currentTranscript = '';
    });
  </script>
</body>
</html>
