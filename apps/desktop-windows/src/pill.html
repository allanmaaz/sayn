<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
    }
    .pill-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(16, 7, 9, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.2px solid rgba(168, 50, 73, 0.5);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(111, 16, 37, 0.4);
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, #8F1835, #6F1025);
      border: 1px solid rgba(245, 235, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5px;
      flex-shrink: 0;
    }
    .brand-bar {
      width: 2px;
      border-radius: 1px;
      background: #F5EBDD;
    }
    .brand-bar:nth-child(1) { height: 9px; }
    .brand-bar:nth-child(2) { height: 14px; }
    .brand-bar:nth-child(3) { height: 10px; }

    .mode-chips {
      display: flex;
      align-items: center;
      gap: 3px;
      -webkit-app-region: no-drag;
    }
    .mode-chip {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      color: #D6C7B2;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-chip:hover {
      color: #F5EBDD;
      background: rgba(255, 255, 255, 0.1);
    }
    .mode-chip.active {
      font-weight: 700;
      color: #F5EBDD;
      background: #6F1025;
      border-color: #A83249;
      box-shadow: 0 0 10px rgba(111, 16, 37, 0.6);
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(168, 50, 73, 0.35);
      flex-shrink: 0;
    }

    .btn-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.07);
      color: #D6C7B2;
    }
    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #EF4444;
    }
    .btn-commit {
      background: #6F1025;
      color: #F5EBDD;
      border: 1px solid #A83249;
      box-shadow: 0 0 12px rgba(111, 16, 37, 0.5);
    }
    .btn-commit:hover {
      transform: scale(1.08);
      background: #8F1835;
    }
    .wave-center {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 4px;
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 20px;
    }
    .wave-bar {
      width: 2.5px;
      border-radius: 2px;
      background: #A83249;
      animation: pulse 1s infinite ease-in-out;
    }
    .wave-bar:nth-child(2n) {
      background: #F5EBDD;
    }
    .wave-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 10px; animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { height: 16px; animation-delay: 0.15s; }
    .wave-bar:nth-child(6) { height: 8px; animation-delay: 0.35s; }

    @keyframes pulse {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1.2); opacity: 1; }
    }

    .status-text {
      font-size: 11px;
      color: #F5EBDD;
      white-space: nowrap;
      font-weight: 600;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="pill-container">
    <!-- Brand Icon -->
    <div class="brand-mark">
      <div class="brand-bar"></div>
      <div class="brand-bar"></div>
      <div class="brand-bar"></div>
    </div>

    <!-- Mode Chips: Dictate | Prompt | Translate | Code -->
    <div class="mode-chips">
      <button class="mode-chip active" data-mode="dictate">Dictate</button>
      <button class="mode-chip" data-mode="prompt">Prompt</button>
      <button class="mode-chip" data-mode="translate">Translate</button>
      <button class="mode-chip" data-mode="code">Code</button>
    </div>

    <div class="divider"></div>

    <!-- Equalizer / Status -->
    <div class="wave-center">
      <div class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="status-text" id="status-text">Listening...</div>
    </div>

    <!-- Actions -->
    <button class="btn-circle btn-cancel" id="btn-cancel" title="Cancel (Esc)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>

    <button class="btn-circle btn-commit" id="btn-commit" title="Commit & Auto-Paste">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let currentMode = 'dictate';
    const modes = ['dictate', 'prompt', 'translate', 'code'];

    const modeChips = document.querySelectorAll('.mode-chip');
    modeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        setMode(chip.dataset.mode);
      });
    });

    function setMode(mode) {
      currentMode = mode;
      modeChips.forEach(chip => {
        if (chip.dataset.mode === mode) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
      ipcRenderer.send('mode-changed', currentMode);
      updateStatusLabel();
    }

    function updateStatusLabel() {
      const titles = {
        dictate: 'Listening...',
        prompt: 'Prompt Mode...',
        translate: 'Translating...',
        code: 'Code Mode...'
      };
      document.getElementById('status-text').innerText = titles[currentMode] || 'Listening...';
    }

    document.getElementById('btn-cancel').onclick = () => {
      ipcRenderer.send('pill-close');
    };

    document.getElementById('btn-commit').onclick = () => {
      ipcRenderer.send('pill-commit', { mode: currentMode });
    };

    ipcRenderer.on('start-listening', () => {
      updateStatusLabel();
    });

    ipcRenderer.on('cycle-mode', () => {
      const nextIdx = (modes.indexOf(currentMode) + 1) % modes.length;
      setMode(modes[nextIdx]);
    });
  </script>
</body>
</html>
