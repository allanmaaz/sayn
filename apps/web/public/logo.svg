<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="c1_bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#14151F" />
      <stop offset="70%" stop-color="#0A0A0D" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="c1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#CBFE00" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="c1_ribbon" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="35%" stop-color="#10E7A6" />
      <stop offset="75%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="c1_bars" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="50%" stop-color="#10E7A6" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="c1_shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00D2FF" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="114" fill="url(#c1_bg)" />
  <rect x="12" y="12" width="488" height="488" rx="114" stroke="url(#c1_rim)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="#10E7A6" opacity="0.06" filter="url(#c1_glow)" />

  <!-- Harmonic 'S' Ribbon -->
  <g filter="url(#c1_shadow)">
    <path d="M 336 172 
             C 336 130, 298 98, 244 98 
             C 182 98, 142 138, 142 194 
             C 142 254, 188 280, 246 300 
             C 304 320, 342 344, 342 396 
             C 342 454, 296 488, 232 488 
             C 168 488, 134 448, 132 404 
             C 132 394, 140 386, 150 386 
             C 160 386, 168 394, 168 402 
             C 170 434, 196 456, 232 456 
             C 278 456, 308 430, 308 394 
             C 308 354, 276 332, 222 314 
             C 164 294, 110 262, 110 196 
             C 110 120, 166 66, 246 66 
             C 318 66, 368 112, 368 172 
             C 368 182, 360 190, 350 190 
             C 340 190, 336 182, 336 172 Z"
          fill="url(#c1_ribbon)" />
  </g>

  <!-- 3 Balanced Audio Frequency Bars Inside S -->
  <g filter="url(#c1_glow)">
    <rect x="210" y="222" width="16" height="68" rx="8" fill="url(#c1_bars)" />
    <rect x="238" y="194" width="16" height="124" rx="8" fill="url(#c1_bars)" />
    <rect x="266" y="214" width="16" height="84" rx="8" fill="url(#c1_bars)" />
  </g>
</svg>