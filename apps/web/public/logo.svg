<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Maroon Premium Gradient -->
    <linearGradient id="sayn_maroon_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F1835" />
      <stop offset="50%" stop-color="#6F1025" />
      <stop offset="100%" stop-color="#4A0817" />
    </linearGradient>
    <linearGradient id="sayn_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBDD" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#A83249" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#100709" stop-opacity="0.6" />
    </linearGradient>
    <filter id="sayn_soft_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6F1025" flood-opacity="0.4" />
    </filter>
    <filter id="sayn_cream_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Maroon Rounded Squircle Base -->
  <g filter="url(#sayn_soft_shadow)">
    <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#sayn_maroon_bg)" />
    <rect x="24" y="24" width="464" height="464" rx="120" stroke="url(#sayn_rim)" stroke-width="3" />
  </g>

  <!-- Soundwave Organic Resonance Mark in Warm Cream #F5EBDD -->
  <!-- Left wave bar -->
  <path d="M 174 198 
           C 174 180, 192 180, 192 198 
           L 192 314 
           C 192 332, 174 332, 174 314 
           Z" 
        fill="#F5EBDD" />

  <!-- Center primary soundwave & voice pillar -->
  <path d="M 242 136 
           C 242 116, 270 116, 270 136 
           L 270 376 
           C 270 396, 242 396, 242 376 
           Z" 
        fill="#F5EBDD" 
        filter="url(#sayn_cream_glow)" />

  <!-- Harmonic curved contour -->
  <path d="M 216 220 
           C 216 195, 232 190, 232 210 
           L 232 302 
           C 232 322, 216 317, 216 292 
           Z" 
        fill="#F5EBDD" opacity="0.88" />

  <!-- Right soundwave bar -->
  <path d="M 320 184 
           C 320 166, 338 166, 338 184 
           L 338 328 
           C 338 346, 320 346, 320 328 
           Z" 
        fill="#F5EBDD" />
</svg>