<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Matte Carbon Black Background -->
  <rect width="100" height="100" rx="24" fill="#0C0C0E"/>
  
  <!-- Subtle Border -->
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="#26262B" stroke-width="1.5"/>

  <!-- Electric Violet Continuous Soundwave 'S' -->
  <!-- Top frequency arc forming top of S -->
  <path d="M 32 40 C 32 30, 42 24, 52 24 C 62 24, 70 30, 70 38 C 70 47, 60 50, 48 53 C 36 56, 30 60, 30 69 C 30 79, 40 85, 52 85 C 64 85, 72 78, 72 67" 
        stroke="#CBFE00" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Top Soundwave Peaks -->
  <path d="M 38 42 L 38 32 M 46 44 L 46 22 M 54 44 L 54 18 M 62 43 L 62 30" 
        stroke="#CBFE00" 
        stroke-width="4.5" 
        stroke-linecap="round"/>

  <!-- Bottom Soundwave Peaks -->
  <path d="M 40 68 L 40 78 M 48 66 L 48 88 M 56 66 L 56 92 M 64 68 L 64 80" 
        stroke="#CBFE00" 
        stroke-width="4.5" 
        stroke-linecap="round"/>
</svg>
